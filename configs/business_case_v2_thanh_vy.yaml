# Giả định business case THẬT do Thanh Vy cung cấp (có nguồn), thay cho bản placeholder.
# status: real_assumptions_from_thanh_vy.
# LƯU Ý: các THAM SỐ CẤU TRÚC của business case (số hồ sơ/năm N, lãi suất chiết khấu,
# tỷ lệ chuyển SIU trong hàng đợi, công thức Net Value ở "Mục 5.2", và tiêu chí quyết định)
# nằm trong tài liệu Mục 5.2 / file monte_carlo_business_case.py của Thanh Vy. CẦN bổ sung
# các số này mới tính được NV_AI, NV_luật, ΔNV, NPV, ROI, DPP. Xem khối needs_confirmation.
schema_version: "2.0"
status: real_assumptions_from_thanh_vy
currency: VND
queue_capacity_K: 0.10          # Recall@10%
frozen_test_prevalence: 0.245   # p của frozen test, dùng cho quy đổi recall binormal
monte_carlo:
  iterations: 10000
  seed: 2026

# Tất cả tỷ lệ [0,1] là Beta; số tiền dương lệch phải là log-normal; khoảng chỉ biết min-max là uniform.
distributions:
  p_group_b:            {dist: beta, alpha: 21.32, beta: 269.42}     # 7,2% (5,0-10,0%)
  recall_ai_test:       {dist: beta, alpha: 11.5, beta: 38.5}        # 22,6% (14,0-33,3%) - Jeffreys 11/49
  recall_rule_test:     {dist: beta, alpha: 8.5, beta: 41.5}         # 16,6% (9,2-26,4%) - Jeffreys 8/49
  loss_per_case:        {dist: lognormal, median: 20000000, sigma: 0.75}  # 20tr (5,8-68,7tr)
  eta_prevented:        {dist: beta, alpha: 9.22, beta: 5.94}        # 0,61 (0,40-0,80)
  c_basic_review:       {dist: uniform, low: 60000, high: 200000}    # c_bs
  c_siu:                {dist: uniform, low: 1500000, high: 6000000} # c_SIU
  c_cskh:               {dist: uniform, low: 20000, high: 60000}     # c_CSKH
  churn_increase:       {dist: beta, alpha: 4.27, beta: 48.48}       # Δq 7,6% (3,0-15,0%)
  customer_value:       {dist: uniform, low: 4000000, high: 12000000}# V_KH
  infra_gpu_year:       {dist: uniform, low: 169600000, high: 339200000}
  staff_ai_year:        {dist: uniform, low: 275200000, high: 550400000}
  monitoring_year:      {dist: uniform, low: 50000000, high: 150000000}
  c_var_per_claim:      {dist: uniform, low: 2000, high: 10000}
  rule_maintenance_year: {dist: uniform, low: 30000000, high: 100000000}
  initial_investment:   {dist: uniform, low: 1200000000, high: 2000000000}  # C0

# Hai recall đo trên cùng 49 hồ sơ nên tương quan: Gaussian copula.
recall_correlation_rho: 0.5

# === SỐ CẤU TRÚC: ước lượng có nguồn (research 22/10/2026), chờ Thanh Vy đối chiếu Mục 5.2 ===
# Thay số ở đây khi có bản chính thức của Thanh Vy; mọi đầu ra đổi theo.
structural:
  annual_claim_volume_N: 60000      # ~900 tỷ bồi thường xe của DN cỡ vừa (MIC ~936 tỷ, PJICO ~880 tỷ, 2024) ÷ ~15tr/vụ
  avg_claim_payout_assumed: 15000000 # bình quân mỗi vụ (giả định để suy N; nguồn bồi thường từ BCTC 2024)
  discount_rate: 0.12               # WACC DN niêm yết VN ~7,6-12% (valueinvesting.io); dùng đầu khung cho đầu tư công nghệ
  horizon_years: 3                  # Thanh Vy: "cả ba năm dùng chung bộ tham số"
  siu_rate_within_queue: 0.10       # 10% hàng đợi chuyển SIU (giả định vận hành) -> ~1% tổng hồ sơ
  c_cskh_applies_to: whole_queue    # mỗi hồ sơ trong hàng đợi phát sinh một lần liên hệ khách

# Công thức NV/NPV/ROI/DPP tái dựng từ bảng tham số theo phương pháp capital budgeting chuẩn
# (xem reports/business_case/BUSINESS_CASE_V2_REPORT.md). Mục 5.2 gốc của Thanh Vy có thể khác
# vài quy ước nhỏ; thay structural + công thức khi có bản chính thức.
decision_criteria:
  npv_positive: 0.0                 # NPV > 0
  dpp_max_years: 3                  # DPP <= 3 năm
  delta_nv_positive: 0.0            # ΔNV hằng năm > 0
