  other_document:
    display_name: "Chứng từ khác/chưa phân loại"
    aliases: [letter, email, questionnaire, handwritten, other]
    required_business_fields: []
    valid_from: "2026-10-16"
    valid_to: null
    last_verified_at: "2026-10-16"
    next_review_due: "2026-11-15"
