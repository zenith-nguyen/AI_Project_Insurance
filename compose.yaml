services:
  claim-review:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      INSURANCE_API_MODE: fixture
      INSURANCE_VERIFY_LOG: /app/runtime/audit/verify.jsonl
    volumes:
      - verify-runtime:/app/runtime
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  monitor:
    profiles: [monitor]
    build:
      context: .
      dockerfile: Dockerfile.monitor
    environment:
      INSURANCE_VERIFY_LOG: /app/runtime/audit/verify.jsonl
    volumes:
      - verify-runtime:/app/runtime:ro
    ports:
      - "127.0.0.1:8501:8501"
volumes:
  verify-runtime:
