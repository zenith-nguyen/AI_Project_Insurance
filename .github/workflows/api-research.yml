name: Research API checks
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API checks
        run: python -m pip install -r requirements-api.txt pytest ruff
      - name: Lint changed API files
        run: python -m ruff check src/api/verify.py src/api/operations_log.py tests/test_verify.py scripts/fairness_audit_phase5.py prototype/monitor_dashboard.py --select E4,E7,E9,F
      - name: Test API contract
        run: python -m pytest -q tests/test_verify.py tests/test_claim_review_api.py tests/test_openapi_contract.py tests/test_metrics.py
      - name: Docker smoke
        run: |
          docker build -f Dockerfile.api -t insurance-research-api .
          docker run -d --name insurance-research -p 8000:8000 insurance-research-api
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/verify \
            -H 'Content-Type: application/json' \
            -d '{"claim_id":"CI-DEMO"}' > /tmp/verify.json
          python -c 'import json; x=json.load(open("/tmp/verify.json")); assert x["human_review_required"] and x["mode"] == "fixture"'
      - name: Build local monitor image
        run: docker build -f Dockerfile.monitor -t insurance-research-monitor .
