services:
  claim-review:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      INSURANCE_API_MODE: fixture
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
